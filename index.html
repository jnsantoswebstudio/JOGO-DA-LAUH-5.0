<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#080d25"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="description" content="Uma aventura de fã feita especialmente para Lauana. 30 fases, cinco portais, sereia azul e o guardião Jonathas."><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="assets/icon-192.png"><title>O Reino das Marés da Lauana — V5</title><link rel="stylesheet" href="styles.css"></head><body>
<div id="app">
<div id="stage" class="stage"><canvas id="game" width="960" height="540" aria-label="Jogo de aventura das marés"></canvas>
<div id="gamehud" class="gamehud hidden"><div class="hud-l"><button id="pause" class="hud-circle" aria-label="Pausar">Ⅱ</button><div><div id="hud-title" class="hud-place"></div><div class="hearts" id="hud-hearts"></div></div></div><div class="hud-r"><span class="hud-pill"><span class="gem">✧</span><strong id="hud-pearls">0</strong></span><span class="hud-pill"><span class="gem">◆</span><strong id="hud-gems">0/5</strong></span><span class="hud-pill" id="hud-power">PODER PRONTO</span></div><div id="quest" class="quest hidden"></div><div id="statusText" role="status" aria-live="polite" class="status hidden"></div></div>
<div id="touch" class="touch hidden" aria-label="Controles de jogo"><div class="left-pad"><div id="joystick" class="joystick"><div id="joystick-knob" class="joystick-knob"></div></div><div id="dpad" class="dpad hidden"><button data-ctl="up" class="du" aria-label="Cima">▲</button><button data-ctl="left" class="dl" aria-label="Esquerda">◀</button><button data-ctl="right" class="dr" aria-label="Direita">▶</button><button data-ctl="down" class="dd" aria-label="Baixo">▼</button></div></div><div class="right-pad"><button class="act interact" data-act="interact" aria-label="Interagir"><span>✦</span><small>FALAR</small></button><button class="act dash" data-act="dash" aria-label="Esquivar"><span>➜</span><small>DASH</small></button><button class="act special" data-act="special" aria-label="Invocar Jonathas"><span>♛</span><small>PODER</small></button><button class="act attack" data-act="attack" aria-label="Atacar"><span>⚔</span><small>ATAQUE</small></button><button class="act jump" data-act="jump" aria-label="Pular ou nadar"><span>⬆</span><small>PULAR</small></button></div></div>
<div id="ui" class="ui" aria-live="off"></div><div id="rotate" class="rotate"><div class="rotate-ico">▭ ↻</div><strong>Melhor de ladinho! ♡</strong><span>Vire o celular na horizontal para jogar com controles maiores.</span><button id="rotate-close" class="btn secondary small">Jogar assim mesmo</button></div></div>
<div id="copyright">Uma aventura não oficial de fã, feita com carinho para Lauana • Sem vínculo com a Mattel</div></div>
<script src="cloud-config.js"></script><script src="cloud.js" defer></script><script src="game.js" defer></script><script>if('serviceWorker'in navigator && (location.protocol==='https:' || location.hostname==='localhost')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}</script></body></html>
